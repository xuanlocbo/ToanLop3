name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify question bank
        run: |
          mkdir -p /tmp/math-check
          javac -encoding UTF-8 -d /tmp/math-check app/src/main/java/vn/toanlop3/Curriculum.java app/src/main/java/vn/toanlop3/BookBank.java tests/CurriculumCheck.java tests/BookBankCheck.java
          java -cp /tmp/math-check CurriculumCheck
          java -cp /tmp/math-check BookBankCheck
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: toanlop3-debug-key-v1
      - name: Build native APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/ToanLop3-0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-APK
          path: dist/ToanLop3-0.3.0.apk
          if-no-files-found: error
          retention-days: 30
