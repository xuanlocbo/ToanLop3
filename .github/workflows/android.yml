name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify question bank
        run: |
          mkdir -p /tmp/math-check
          javac -encoding UTF-8 -d /tmp/math-check app/src/main/java/vn/toanlop3/Curriculum.java app/src/main/java/vn/toanlop3/BookBank.java tests/CurriculumCheck.java tests/BookBankCheck.java app/src/main/java/vn/toanlop3/WaterPuzzle.java tests/WaterPuzzleCheck.java
          java -cp /tmp/math-check CurriculumCheck
          java -cp /tmp/math-check BookBankCheck
          java -cp /tmp/math-check WaterPuzzleCheck
          python3 tests/check_game_assets.py
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: toanlop3-debug-key-v1
      - name: Build native APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/ToanLop3-0.6.0.apk
          python3 tests/check_game_assets.py "$APK"
          sha256sum dist/ToanLop3-0.6.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-APK
          path: dist/ToanLop3-0.6.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 tests/native_smoke.py
      - name: Upload runtime QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-QA
          path: dist/qa/
          if-no-files-found: ignore
          retention-days: 7
