name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-verified-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify entire question bank and puzzles
        run: |
          mkdir -p /tmp/math-check
          javac -encoding UTF-8 -d /tmp/math-check app/src/main/java/vn/toanlop3/{Curriculum,BookBank,WaterPuzzle,ShapePuzzle}.java tests/{CurriculumCheck,BookBankCheck,WaterPuzzleCheck,ShapePuzzleCheck,BankAudit}.java
          for check in CurriculumCheck BookBankCheck WaterPuzzleCheck ShapePuzzleCheck BankAudit; do java -cp /tmp/math-check "$check"; done
          python3 tests/check_game_assets.py
      - name: Build native APK
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease
      - name: Verify package and signing identity
        id: sign
        env:
          SIGNING_JSON: ${{ secrets.TOANLOP3_SIGNING }}
        run: |
          set -euo pipefail
          mkdir -p dist/build dist/qa dist/published
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$UNSIGNED" dist/build/ToanLop3-0.6.1-unsigned.apk
          cp "$BT/lib/apksigner.jar" dist/build/apksigner.jar
          printf '%s\n' "$GITHUB_SHA" > dist/build/commit.txt
          sha256sum dist/build/ToanLop3-0.6.1-unsigned.apk > dist/build/unsigned-sha256.txt
          if [ -n "${SIGNING_JSON:-}" ]; then
            KEYDIR="$(mktemp -d)"
            export KEYDIR
            trap 'rm -rf "$KEYDIR"' EXIT
            python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          j=json.loads(os.environ['SIGNING_JSON'])
          p=Path(os.environ['KEYDIR'])
          (p/'key.p12').write_bytes(base64.b64decode(j['keystore_b64'],validate=True))
          (p/'password').write_text(j['password'])
          PY
            "$BT/apksigner" sign --ks "$KEYDIR/key.p12" --ks-key-alias toanlop3 --ks-pass "file:$KEYDIR/password" --key-pass "file:$KEYDIR/password" --out dist/published/ToanLop3-0.6.1.apk "$UNSIGNED"
            "$BT/apksigner" verify --verbose --print-certs dist/published/ToanLop3-0.6.1.apk > dist/build/signature.txt
            grep -Fqi "53c9a53416c3ba400c645417be621254a79c22553be31188548afcc642cba57b" dist/build/signature.txt
            cp dist/published/ToanLop3-0.6.1.apk dist/build/qa-release.apk
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Permanent signing secret is absent. No official signed release will be published; only the build for testing/local signing."
            KEYDIR="$(mktemp -d)"
            trap 'rm -rf "$KEYDIR"' EXIT
            keytool -genkeypair -alias qa -keyalg RSA -keysize 2048 -validity 365 -storetype PKCS12 -keystore "$KEYDIR/qa.p12" -storepass android -keypass android -dname "CN=ToanLop3 ephemeral QA only" >/dev/null 2>&1
            "$BT/apksigner" sign --ks "$KEYDIR/qa.p12" --ks-pass pass:android --key-pass pass:android --ks-key-alias qa --out dist/build/qa-release.apk "$UNSIGNED"
            "$BT/apksigner" verify --verbose --print-certs dist/build/qa-release.apk > dist/build/signature.txt
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          "$BT/aapt" dump badging dist/build/qa-release.apk > dist/build/package.txt
          grep -F "package: name='vn.toanlop3' versionCode='8' versionName='0.6.1'" dist/build/package.txt
          if grep -q 'application-debuggable' dist/build/package.txt; then exit 1; fi
          python3 tests/check_game_assets.py dist/build/qa-release.apk
          sha256sum dist/build/qa-release.apk > dist/build/qa-sha256.txt
          head -8 dist/build/package.txt
      - name: Upload unverified build for local signing
        if: always() && steps.sign.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-build-v0.6.1
          path: dist/build/
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android emulator smoke test and full UI sweep
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            python3 tests/native_smoke.py
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w vn.toanlop3.test/vn.toanlop3.QaRunner | tee dist/qa/full-sweep.txt
            grep -F 'QA_SWEEP_PASS' dist/qa/full-sweep.txt
            python3 tests/release_smoke.py
      - name: Upload runtime QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-QA-v0.6.1
          path: dist/qa/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish verified stable APK
        if: steps.sign.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ToanLop3-APK-v0.6.1
          path: dist/published/ToanLop3-0.6.1.apk
          if-no-files-found: error
          retention-days: 30
