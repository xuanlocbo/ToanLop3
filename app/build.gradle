plugins { id 'com.android.application' }
android {
    namespace 'vn.toanlop3'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.toanlop3'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '0.6.1'
        resValue 'string', 'build_commit', System.getenv('GITHUB_SHA') ?: 'local'
        testInstrumentationRunner 'vn.toanlop3.QaRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
